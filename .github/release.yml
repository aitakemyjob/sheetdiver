# Groups GitHub's generated release notes by label.
changelog:
  exclude:
    labels: [duplicate, invalid, wontfix]
    authors: [dependabot, "dependabot[bot]"]
  categories:
    - title: Breaking changes
      labels: [breaking change]
    - title: New features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Security
      labels: [security]
    - title: Documentation
      labels: [documentation]
    - title: Build, CI and packaging
      labels: [ci, "area: packaging", dependencies]
    - title: Other changes
      labels: ["*"]
