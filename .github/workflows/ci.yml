name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.x'
  NODE_VERSION: '24'

jobs:
  # Whether the change needs the builds and tests: a pull request that only
  # touches documentation doesn't (scripts/ci-changes.sh says which files
  # count). Pushes to main always run everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$BASE...$HEAD" | tee "$RUNNER_TEMP/changed"
            code=$(scripts/ci-changes.sh < "$RUNNER_TEMP/changed")
          else
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = true ] || echo "::notice::Documentation only: builds and tests skipped"

  go:
    name: Go · ${{ matrix.os }}
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # The steps, not the job, are skipped for documentation: a skipped
    # matrix job reports one check under its unexpanded name, and the
    # required "Go · <os>" checks would wait for it.
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CODE == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.CODE == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true  # runner caches can lag behind the latest patch
      - name: gofmt
        if: env.CODE == 'true' && runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        if: env.CODE == 'true'
        run: go vet -tags nogui ./...
      - name: go test
        if: env.CODE == 'true'
        run: go test -race -tags nogui -count=1 ./...

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true  # runner caches can lag behind the latest patch
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5.0
          # Build with the job's Go: prebuilt binaries made with an older Go
          # can't type-check code that targets a newer one.
          install-mode: goinstall
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: ESLint
        working-directory: frontend
        run: npm ci && npm run lint

  security:
    name: Security audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true  # runner caches can lag behind the latest patch
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@e672cbe8fbc8c76e28fcb6db0efd9ce354e0dac5 # v1.9.0
          govulncheck -tags nogui ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Third-party notices are up to date
        working-directory: .
        run: |
          go run ./scripts/notices -o "$RUNNER_TEMP/notices.md"
          diff -u THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/notices.md" || {
            echo "::error::THIRD_PARTY_NOTICES.md is out of date; run make notices and commit it"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  desktop:
    name: Desktop build · ${{ matrix.os }}
    needs: [changes, go, frontend]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true  # runner caches can lag behind the latest patch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: scripts/build.sh --version "ci-${GITHUB_SHA::7}"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/build.ps1 -Version "ci-$($env:GITHUB_SHA.Substring(0,7))"
      - name: Smoke test CLI
        shell: bash
        run: |
          bin=build/bin/sheetdiver
          [ "$RUNNER_OS" = "Windows" ] && bin=build/bin/sheetdiver.exe
          [ "$RUNNER_OS" = "macOS" ] && bin=build/bin/SheetDiver.app/Contents/MacOS/sheetdiver
          "$bin" version | grep -q "ci-"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # The console MCP bridge sits beside the app and answers on stdio,
            # serving the library itself while the app is closed, and
            # answering before it exits when its input closes at once.
            build/bin/sheetdiver-mcp.exe -version 2>&1 | grep -q "ci-"
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' |
              build/bin/sheetdiver-mcp.exe | grep -q '"id":1,"result"'
            echo '{"jsonrpc":"2.0","id":0,"method":"server/discover","params":{}}' |
              build/bin/sheetdiver-mcp.exe | grep -q '"id":0,"error"'
          fi
  headless:
    name: Headless cross-compile
    needs: [changes, go, frontend]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true  # runner caches can lag behind the latest patch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: scripts/build.sh --headless
      - name: Claude Desktop extension (Windows) validates
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/sheetdiver-mcp.exe" ./cmd/sheetdiver-mcp
          go run ./scripts/mcpb -bridge "$RUNNER_TEMP/sheetdiver-mcp.exe" -o "$RUNNER_TEMP/sheetdiver.mcpb"
          unzip -q "$RUNNER_TEMP/sheetdiver.mcpb" -d "$RUNNER_TEMP/mcpb"
          npx -y @anthropic-ai/mcpb@2.1.2 validate "$RUNNER_TEMP/mcpb/manifest.json"
      - name: Claude Desktop extension (Linux) installs and answers
        run: |
          # Built, unpacked by the official unpacker (as Claude Desktop does),
          # then started the way Claude Desktop starts it: the bridge must
          # stay executable and answer the version probe and initialize.
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/sheetdiver-mcp" ./cmd/sheetdiver-mcp
          go run ./scripts/mcpb -platform linux -bridge "$RUNNER_TEMP/sheetdiver-mcp" -o "$RUNNER_TEMP/linux.mcpb"
          npx -y @anthropic-ai/mcpb@2.1.2 unpack "$RUNNER_TEMP/linux.mcpb" "$RUNNER_TEMP/linux"
          npx -y @anthropic-ai/mcpb@2.1.2 validate "$RUNNER_TEMP/linux/manifest.json"
          test -x "$RUNNER_TEMP/linux/server/sheetdiver-mcp"
          export SHEETDIVER_CONFIG="$RUNNER_TEMP/cfg.json" SHEETDIVER_LIBRARY="$RUNNER_TEMP/lib" SHEETDIVER_MCP_LOG="$RUNNER_TEMP/mcp.log"
          out=$(printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":0,"method":"server/discover","params":{}}' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | "$RUNNER_TEMP/linux/server/sheetdiver-mcp" --port 0)
          echo "$out" | grep -q '"id":0,"error"'
          echo "$out" | grep -q '"id":1,"result"'
          cat "$RUNNER_TEMP/mcp.log"
