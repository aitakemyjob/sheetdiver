name: Label PRs

# Adds area labels to pull requests from the files they touch
# (rules in .github/labeler.yml). pull_request_target lets this work on
# fork PRs; it never checks out or runs the PR's code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false
