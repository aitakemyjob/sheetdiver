# Checks extraction against real manufacturer datasheets (see
# testdata/corpus/manifest.json). It downloads them, so it runs weekly and
# on demand rather than on every push; datasheets the sites refuse to
# serve to scripts are skipped.
name: Datasheet corpus

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Download corpus
        run: scripts/corpus.sh
      - name: Check extraction
        run: make test-corpus
