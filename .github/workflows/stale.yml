name: Close stale repro requests

# Issues waiting on reproduction details (label "needs repro") get a
# reminder after 21 days without activity and close 14 days later. Any
# comment resets the clock. Nothing else is touched.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-labels: needs repro
          days-before-stale: 21
          days-before-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been waiting on reproduction details for three weeks.
            It will close in 14 days unless there's new information. Please comment
            if you can still reproduce it, and we'll keep it open.
          close-issue-message: >
            Closing because we couldn't reproduce this without more details.
            Comment with steps to reproduce and we'll reopen it.
          close-issue-reason: not_planned
