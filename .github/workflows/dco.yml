name: DCO

# Every commit in a pull request must carry a Developer Certificate of
# Origin sign-off (`git commit -s`), certifying the contributor has the
# right to submit it (https://developercert.org). Bot commits are exempt.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Check Signed-off-by on every commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          bad=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate --jq '
            .[]
            | select(((.author.login // "") | endswith("[bot]")) | not)
            | select(.commit.message | test("(?m)^Signed-off-by: .+ <[^>]+@[^>]+>") | not)
            | "\(.sha[0:7]) by \(.author.login // .commit.author.name)"')
          if [ -n "$bad" ]; then
            while read -r line; do echo "::error::Commit $line has no Signed-off-by line"; done <<< "$bad"
            echo "Sign off your commits with 'git commit -s' (or 'git rebase --signoff main' for existing ones)."
            exit 1
          fi
          echo "All commits are signed off."
