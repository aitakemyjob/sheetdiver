name: Feature request
description: Suggest an idea or improvement for SheetDiver.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and why it's hard today.
      placeholder: "When I add a gate driver to a project I want its bootstrap capacitor sized from the MOSFET's gate charge..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: The ideal behaviour, a sketch of the UI, or an MCP tool you'd want agents to have.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Extraction
        - Library UI
        - Projects
        - Calculators
        - Agent / MCP tools
        - Install / packaging
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to help implement this.
